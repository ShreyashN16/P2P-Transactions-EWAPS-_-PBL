version: "3.9"

services:
  # ──────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ewasp_db
    environment:
      POSTGRES_DB: ewasp
      POSTGRES_USER: ewasp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ewasp_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewasp_user -d ewasp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ewasp_net

  # ──────────────────────────────────────
  # Redis Cache
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ewasp_redis
    ports:
      - "6379:6379"
    networks:
      - ewasp_net

  # ──────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ewasp_backend
    environment:
      DATABASE_URL: postgresql://ewasp_user:${DB_PASSWORD:-ewasp_secure_2024}@db:5432/ewasp
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      FOREX_API_KEY: ${FOREX_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ml_models:/app/models
    networks:
      - ewasp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ewasp_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ewasp_net
    restart: unless-stopped

  # ──────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ewasp_nginx
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ewasp_net
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:

networks:
  ewasp_net:
    driver: bridge
